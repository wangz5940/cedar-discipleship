name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go race and MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: Verify modules and build
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go build ./...
      - name: Run unit and integration tests
        env:
          CEDAR_TEST_MYSQL_ADDR: 127.0.0.1:${{ job.services.mysql.ports['3306'] }}
        run: go test -race -shuffle=on -tags=integration -count=1 -timeout=120s ./...

  backend-analysis:
    name: Go static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          check-latest: true
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend
      - name: Check reachable vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  scripts:
    name: Python and Shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test synchronization and deployment guards
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z '*.sh')
