name: Changelog

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate-changelog:
    name: Validate changelog references
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject changelog placeholders
        shell: bash
        run: |
          set -euo pipefail

          if grep -Eq '本次提交|待回填' CHANGELOG.md; then
            printf 'CHANGELOG.md must not contain 本次提交 or 待回填 placeholders.\n' >&2
            exit 1
          fi
