name: Build Docker Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: backend/Dockerfile
            image_suffix: backend
          - service: frontend
            dockerfile: frontend/Dockerfile
            image_suffix: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare image names
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          repo_name="${repository#*/}"
          echo "IMAGE_OWNER=${repository%%/*}" >> "$GITHUB_ENV"
          echo "IMAGE_REPO=${repo_name}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${REGISTRY}/${repository%%/*}/${repo_name}-${{ matrix.image_suffix }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:master
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
