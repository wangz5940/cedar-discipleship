# Correlate gateway failures without logging query strings, cookies or credentials.
map $http_x_log_id $cedar_request_log_id {
  default $request_id;
  "~^[0-9a-f]{32}$" $http_x_log_id;
}
log_format cedar_diagnostics escape=json
  '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
  '"status":$status,"duration_s":$request_time,"upstream_status":"$upstream_status",'
  '"upstream_duration_s":"$upstream_response_time","log_id":"$cedar_request_log_id",'
  '"response_log_id":"$upstream_http_x_log_id"}';

map "$request_method:$status" $cedar_access_loggable {
  default 1;
  ~^(GET|HEAD|OPTIONS):[23] 0;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/cedar/access.log cedar_diagnostics if=$cedar_access_loggable;
  access_log /dev/stdout cedar_diagnostics if=$cedar_access_loggable;
  error_log /var/log/cedar/error.log notice;
  error_log /dev/stderr notice;

  client_max_body_size 200m;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* ^/(?!assets/|site-avatar\.png$).+\.(?:pdf|md|markdown|mp4|webm|mov|m4v|docx?|pptx?|png|jpe?g|webp)$ {
    return 404;
  }

  location = /launch {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    absolute_redirect off;
    return 302 /?_launch=$request_id;
  }

  location = / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files /index.html =404;
  }

  location = /version.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files /version.json =404;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files /site.webmanifest =404;
  }

  location /assets/ {
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
