map "$request_method:$status" $cedar_access_loggable {
  default 1;
  ~^(GET|HEAD|OPTIONS):[23] 0;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/cedar/access.log main if=$cedar_access_loggable;
  access_log /dev/stdout main if=$cedar_access_loggable;
  error_log /var/log/cedar/error.log notice;
  error_log /dev/stderr notice;

  client_max_body_size 200m;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* ^/(?!assets/|site-avatar\.png$).+\.(?:pdf|md|markdown|mp4|webm|mov|m4v|docx?|pptx?|png|jpe?g|webp)$ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
