services:
  mysql:
    image: mysql:8.0
    container_name: ${AGP_CONTAINER_PREFIX:-agp}-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower-case-table-names=${MYSQL_LOWER_CASE_TABLE_NAMES:-0}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agp}
      MYSQL_USER: ${MYSQL_USER:-agp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${AGP_MYSQL_PORT:-3307}:3306"
    volumes:
      - ${AGP_DATA_DIR:-../data}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -Nse 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
        GOSUMDB: "${GOSUMDB:-sum.golang.org}"
        GOPRIVATE: "${GOPRIVATE:-}"
        GONOSUMDB: "${GONOSUMDB:-}"
        GONOPROXY: "${GONOPROXY:-}"
    container_name: ${AGP_CONTAINER_PREFIX:-agp}-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      AGP_ADDR: ":8080"
      AGP_DSN: "${MYSQL_USER:-agp}:${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}@tcp(mysql:3306)/${MYSQL_DATABASE:-agp}?parseTime=true&multiStatements=false&charset=utf8mb4,utf8"
      AGP_JWT_SECRET: "${AGP_JWT_SECRET:?AGP_JWT_SECRET must be set in .env}"
      AGP_TOKEN_TTL: "${AGP_TOKEN_TTL:-}"
      AGP_ASSETS_ROOT: "/data/agp/assets"
      AGP_CONTENT_ROOT: "/data/agp/content"
      AGP_MIGRATIONS_DIR: "/app/migrations"
      BOOTSTRAP_SUPERADMIN_USERNAME: "${BOOTSTRAP_SUPERADMIN_USERNAME:-admin}"
      BOOTSTRAP_SUPERADMIN_PASSWORD: "${BOOTSTRAP_SUPERADMIN_PASSWORD:?BOOTSTRAP_SUPERADMIN_PASSWORD must be set in .env}"
      BOOTSTRAP_SUPERADMIN_DISPLAY_NAME: "${BOOTSTRAP_SUPERADMIN_DISPLAY_NAME:-超级管理员}"
    volumes:
      - ${AGP_DATA_DIR:-../data}/assets:/data/agp/assets
      - ../Book:/data/agp/content/Book:ro
      - ../Mentor:/data/agp/content/Mentor:ro
      - ../Newtestament:/data/agp/content/Newtestament:ro
      - ../Passage:/data/agp/content/Passage:ro
      - ../PPT:/data/agp/content/PPT:ro
      - ../newtestament.md:/data/agp/content/newtestament.md:ro
      - ../weekly_task.md:/data/agp/content/weekly_task.md:ro
      - ../Kuangye.md:/data/agp/content/Kuangye.md:ro
      - ../README.md:/data/agp/content/README.md:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: "${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}"
    container_name: ${AGP_CONTAINER_PREFIX:-agp}-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ../Book:/usr/share/nginx/html/Book:ro
      - ../Mentor:/usr/share/nginx/html/Mentor:ro
      - ../Newtestament:/usr/share/nginx/html/Newtestament:ro
      - ../Passage:/usr/share/nginx/html/Passage:ro
      - ../PPT:/usr/share/nginx/html/PPT:ro
      - ../newtestament.md:/usr/share/nginx/html/newtestament.md:ro
      - ../weekly_task.md:/usr/share/nginx/html/weekly_task.md:ro
      - ../Kuangye.md:/usr/share/nginx/html/Kuangye.md:ro
    ports:
      - "${AGP_WEB_PORT:-5114}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
