<!DOCTYPE html>
<!-- 部署时将 __CHECKIN_URL__ 替换为新平台的 HTTPS 地址，再发布至旧站首页。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站暂停使用</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .card {
      width: min(520px, 90vw);
      padding: 48px 32px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 18px;
      font-size: 30px;
    }

    p {
      margin: 10px 0;
      font-size: 23px;
      line-height: 1.7;
      color: #6b7280;
    }

    .button {
      display: inline-block;
      margin-top: 26px;
      padding: 14px 28px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
      background: #1d4ed8;
    }

    .url {
      margin-top: 16px;
      font-size: 14px;
      color: #9ca3af;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>网站暂停使用</h1>

    <p>本网站现已暂停使用。</p>
    <p>新打卡网站请移步至：</p>

    <a
      class="button"
      href="__CHECKIN_URL__"
    >
      前往新打卡网站
    </a>
  </div>
</body>
</html>
